name: test

on:
  push:
  pull_request:

jobs:
  agent-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webagent-core/agent-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm test

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node webagent-core/agent-host/tests/installerPackaging.test.js
      - run: node installer/package.js
      - name: Compile Windows input helpers and validate script syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('input.cs','input2.cs','keys.cs')) {
            Add-Type -Path (Join-Path 'computer-use/win' $file)
          }
          foreach ($file in Get-ChildItem computer-use/win/*.ps1) {
            $tokens=$null; $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          if ([WinInput]::Click([IntPtr]::Zero,0,0) -notlike 'ERR_*') { throw 'Invalid window must fail' }
          if ([WinBgKeys]::SendChars([IntPtr]::Zero,'') -notlike 'ERR_*') { throw 'Invalid window must fail' }
      - name: Compile clean installer payload
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $ErrorActionPreference = 'Continue'
          & $iscc /Qp installer/webagent.iss 2>&1 | Tee-Object -Variable compileLog
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $detail = (($compileLog | Select-Object -Last 12) -join '%0A')
            Write-Output "::error::$detail"
          }
          exit $result
