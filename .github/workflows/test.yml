name: test

on:
  push:
  pull_request:

jobs:
  agent-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webagent-core/agent-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm test
