name: test

on:
  push:
  pull_request:

jobs:
  agent-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webagent-core/agent-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm test

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node webagent-core/agent-host/tests/installerPackaging.test.js
      - run: node installer/package.js
      - name: Compile clean installer payload
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $ErrorActionPreference = 'Continue'
          & $iscc /Qp installer/webagent.iss 2>&1 | Tee-Object -Variable compileLog
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $detail = (($compileLog | Select-Object -Last 12) -join '%0A')
            Write-Output "::error::$detail"
          }
          exit $result
