name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
        include:
          - os: ubuntu-latest
            node: 18
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: webagent-core/agent-host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - name: Check documentation inventory
        run: node ../../docs-site/check-docs.js
      - name: Audit high-severity production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          WEBAGENT_DEBUG_PROCESS: ${{ runner.os == 'Windows' && '1' || '0' }}
      - name: Repeat Windows cancellation and stdio lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            node scripts/run-tests.js --filter=ptyLifecycle
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          1..2 | ForEach-Object {
            node scripts/run-tests.js --filter=stdioMcp
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check documentation with Windows line endings
        run: |
          npm ci --prefix webagent-core/agent-host --no-audit --no-fund
          node docs-site/check-docs.js
      - run: node webagent-core/agent-host/tests/installerPackaging.test.js
      - run: node installer/package.js
      - name: Build standalone Probe Companion VSIX (no installation)
        run: python webagent-core/probe-extension/package_vsix.py --verify
      - name: Build and verify unified browser Inspector
        run: python webagent-core/probe-extension/package_browser.py --verify
      - name: Compile Windows input helpers and validate script syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Path @('webagent-core/agent-host/src/tools/commandJob.cs', 'webagent-core/agent-host/src/mcp/stdioBridge.cs')
          $tokens=$null; $parseErrors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'webagent-core/agent-host/src/mcp/stdioBridge.ps1'),[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          foreach ($file in @('capture.cs','mark.cs')) {
            Add-Type -Path (Join-Path 'computer-use/win' $file) -ReferencedAssemblies System.Drawing
          }
          foreach ($file in @('input.cs','input2.cs','keys.cs')) {
            Add-Type -Path (Join-Path 'computer-use/win' $file)
          }
          foreach ($file in Get-ChildItem computer-use/win/*.ps1) {
            $tokens=$null; $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          if ([WinInput]::Click([IntPtr]::Zero,0,0) -notlike 'ERR_*') { throw 'Invalid window must fail' }
          if ([WinBgKeys]::SendChars([IntPtr]::Zero,'') -notlike 'ERR_*') { throw 'Invalid window must fail' }
      - name: Compile clean installer payload
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $ErrorActionPreference = 'Continue'
          & $iscc /Qp installer/webagent.iss 2>&1 | Tee-Object -Variable compileLog
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $detail = (($compileLog | Select-Object -Last 12) -join '%0A')
            Write-Output "::error::$detail"
          }
          exit $result

  workbench-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webagent-core/agent-host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
