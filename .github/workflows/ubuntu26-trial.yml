name: ubuntu26-trial

# F113 (handoff item 2, user chose option B): GitHub moves ubuntu-latest to Ubuntu 26 on 2026-10-19.
# test.yml stays pinned to ubuntu-24.04; this separate, temporary workflow runs the same Linux jobs on
# ubuntu-26.04 so the switch is decided on evidence. It does not change test.yml's nine jobs. Remove
# this file once test.yml has been moved (or the decision is to stay on 24.04).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-host:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: webagent-core/agent-host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - name: Check documentation inventory
        run: node ../../docs-site/check-docs.js
      - name: Lint (correctness rules only)
        if: matrix.node == 22
        run: npm run lint
      - run: npm test

  workbench-browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webagent-core/agent-host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
