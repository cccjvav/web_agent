name: mcp-acceptance-temp
# Temporary F123 acceptance relay; removed right after the run. The URL comes only from secrets.MCP_URL.
on:
  push:
    branches: [arena/01a0e8ea-web-agent]
    paths: [.github/workflows/mcp-acceptance-temp.yml]
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: run acceptance against MCP_URL
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
        run: |
          test -n "$MCP_URL" || { echo "MCP_URL secret missing"; exit 1; }
          cat > a.mjs <<'SCRIPT'
          const url = process.argv[2]; const secret = url.split('/mcp/')[1].split(/[/?#]/)[0];
          let session = null, id = 0;
          async function rpc(method, params) {
            const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json, text/event-stream', ...(session ? { 'mcp-session-id': session } : {}) }, body: JSON.stringify({ jsonrpc: '2.0', id: ++id, method, params }) });
            session = session || r.headers.get('mcp-session-id'); const t = await r.text();
            return t.startsWith('{') ? JSON.parse(t) : JSON.parse(t.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5)).pop());
          }
          await rpc('initialize', { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'arena-version-check', version: '1' } });
          const out = [];
          const call = async (name, args) => { const r = await rpc('tools/call', { name, arguments: args }); const t = (r.result?.content || []).map(c => c.text || '').join(''); try { return JSON.parse(t).stdout ?? t; } catch { return t; } };
          const verify = [
            "const path = require('path'), fs = require('fs');",
            "const m = require(path.resolve('webagent-core/agent-host/src/agent/computerUse.js'));",
            "const ws = 'c:' + path.resolve('.').slice(2);  // lower-case drive letter, as VS Code passes it",
            "const png = path.resolve('.webagent-acceptance', 'v.png');",
            "fs.writeFileSync(png, Buffer.from('89504e470d0a1a0a', 'hex'));",
            "console.log(JSON.stringify({ ws, png, inWorkspace: m.resolveShotPath(png, { workspaceRoot: ws }), outside: m.resolveShotPath('C:\\\\Windows\\\\x.png', { workspaceRoot: ws }), candidates: m.findShotCandidates({ command: 'snap -Out ' + png }) }));",
            "fs.rmSync(path.resolve('.webagent-acceptance'), { recursive: true, force: true });"
          ].join('\n');
          out.push('write => ' + String(await call('write_file', { filePath: '.webagent-acceptance/verify-f124.js', content: verify, createOnly: true })).slice(0, 80));
          out.push('git => ' + String(await call('run_command', { command: 'git log -1 --format=%h' })).trim());
          out.push('verify => ' + String(await call('run_command', { command: 'node .webagent-acceptance/verify-f124.js' })).trim());
          const w = await rpc('tools/call', { name: 'workspace_info', arguments: {} });
          out.push('host => ' + ((w.result?.content || [])[0]?.text || '').match(/"startedAt":"[^"]+"/)?.[0]);
          console.log(out.join('\n').split(secret).join('<secret>'));
          SCRIPT
          set +e
          node a.mjs "$MCP_URL" > out.txt 2>&1; rc=$?
          echo "::notice title=acceptance rc=$rc::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' out.txt)"
          exit $rc
